<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DIA TECHBROS - Administration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .admin-header {
            background: #0d6efd;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 25px;
        }

        .refresh-btn {
            border: none;
            background: white;
            color: #0d6efd;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .container-admin {
            padding: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stat-card i {
            font-size: 30px;
            color: #0d6efd;
        }

        .stat-card h2 {
            margin-top: 10px;
            margin-bottom: 0;
        }

        .orders-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .order-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .order-id {
            color: #0d6efd;
            font-weight: bold;
        }

        .customer-info {
            background: #f4f7fb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .order-total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            color: #0d6efd;
            margin-top: 15px;
        }

        .delete-btn {
            border: none;
            background: #dc3545;
            color: white;
            padding: 8px 12px;
            border-radius: 7px;
        }

        .empty {
            text-align: center;
            padding: 50px;
            color: #777;
        }

        @media (max-width: 768px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .container-admin {
                padding: 15px;
            }

            .admin-header {
                padding: 15px;
            }

            .order-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

    </style>
</head>

<body>

    <header class="admin-header">

        <h1>
            <i class="bi bi-speedometer2"></i>
            DIA TECHBROS — Admin
        </h1>

        <button class="refresh-btn" id="refreshOrders">
            <i class="bi bi-arrow-clockwise"></i>
            Actualiser
        </button>

    </header>


    <main class="container-admin">

        <!-- STATISTIQUES -->

        <div class="stats">

            <div class="stat-card">
                <i class="bi bi-cart-check"></i>
                <p>Commandes</p>
                <h2 id="totalOrders">0</h2>
            </div>

            <div class="stat-card">
                <i class="bi bi-currency-dollar"></i>
                <p>Chiffre d'affaires</p>
                <h2 id="totalRevenue">0 FCFA</h2>
            </div>

            <div class="stat-card">
                <i class="bi bi-people"></i>
                <p>Clients</p>
                <h2 id="totalCustomers">0</h2>
            </div>

        </div>


        <!-- COMMANDES -->

        <div class="orders-container">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h3>
                    <i class="bi bi-bag-check"></i>
                    Commandes reçues
                </h3>

            </div>

            <div id="ordersList">

                <div class="empty">
                    <i class="bi bi-hourglass-split"></i>
                    <p>Chargement des commandes...</p>
                </div>

            </div>

        </div>

    </main>


    <script src="admin.js"></script>

</body>

<div id="adminLogin" style="
    position: fixed;
    inset: 0;
    background: #f4f7fb;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
">

    <div style="
        background: white;
        width: 360px;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        text-align: center;
    ">

        <i class="bi bi-lock-fill"
           style="font-size: 45px; color: #0d6efd;">
        </i>

        <h3 class="mt-3">Accès administrateur</h3>

        <p class="text-muted">
            Entrez le code pour voir les commandes.
        </p>

        <input
            type="password"
            id="adminPassword"
            class="form-control mb-3"
            placeholder="Code administrateur"
        >

        <button
            id="loginButton"
            class="btn btn-primary w-100">
            Accéder aux commandes
        </button>

        <p
            id="loginError"
            style="color:#dc3545; display:none; margin-top:15px;">
            Code incorrect.
        </p>

    </div>

</div>

</html>
